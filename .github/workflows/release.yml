name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: xraph/go-workflows/.github/workflows/go-release.yml@v1
    with:
      version: ${{ inputs.version }}
      go-version: '1.26'
    secrets: inherit
